services:

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin

    user: "${PUID}:${PGID}"


    ports:
      - "8096:8096/tcp"
      - "7359:7359/udp"

    volumes:
      - /home/roman/jellyfin/config:/config
      - /home/roman/jellyfin/cache:/cache

      # Jellyfin только читает медиатеку.
      - /home/roman/Downloads:/media:ro

    environment:
      TZ: ${TZ}

    restart: unless-stopped

    networks:
      - media


  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr

    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      UMASK: "002"

    volumes:
      - ./config/sonarr:/config

      # Важно: единый /data.
      - /data:/data

    ports:
      - "8989:8989"

    restart: unless-stopped

    networks:
      - media


  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr

    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      UMASK: "002"

    volumes:
      - ./config/radarr:/config

      # Важно: тот же /data, что у Sonarr.
      - /data:/data

    ports:
      - "7878:7878"

    restart: unless-stopped

    networks:
      - media


  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr

    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      UMASK: "002"

    volumes:
      - ./config/prowlarr:/config

    ports:
      - "9696:9696"

    restart: unless-stopped

    networks:
      - media


networks:
  media:
    name: media
    driver: bridge
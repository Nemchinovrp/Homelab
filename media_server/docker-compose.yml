services:

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin

    user: "${PUID}:${PGID}"

    environment:
      TZ: ${TZ}

    ports:
      - "8096:8096/tcp"
      - "7359:7359/udp"

    volumes:
      - /home/roman/media-stack/config/jellyfin:/config
      - /home/roman/media-stack/config/jellyfin-cache:/cache

      # Jellyfin только читает готовую медиатеку
      - /home/roman/media-stack/data/media:/media:ro

    restart: unless-stopped

    networks:
      - media


  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr

    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      UMASK: "002"

    volumes:
      - /home/roman/media-stack/config/sonarr:/config

      # Один общий mount для downloads + media
      - /home/roman/media-stack/data:/data

    ports:
      - "8989:8989"

    restart: unless-stopped

    networks:
      - media


  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr

    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      UMASK: "002"

    volumes:
      - /home/roman/media-stack/config/radarr:/config

      # Тот же /data, что и у Sonarr
      - /home/roman/media-stack/data:/data

    ports:
      - "7878:7878"

    restart: unless-stopped

    networks:
      - media


  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr

    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      UMASK: "002"

    volumes:
      - /home/roman/media-stack/config/prowlarr:/config

    ports:
      - "9696:9696"

    restart: unless-stopped

    networks:
      - media


networks:
  media:
    name: media
    driver: bridge
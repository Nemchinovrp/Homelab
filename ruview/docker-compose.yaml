services:
  ruview:
    image: ruvnet/wifi-densepose:latest
    container_name: ruview

    restart: unless-stopped

    ports:
      - "3123:3000"
      - "3001:3001"
      - "5005:5005/udp"

    environment:
      RUST_LOG: info
      RUVIEW_ALLOW_UNAUTHENTICATED: "1"

    volumes:
      - ruview-data:/app/data

volumes:
  ruview-data:
# БАЗОВЫЕ НАСТРОЙКИ
http_port 3128 transparent
visible_hostname warp-squid-proxy
dns_v4_first on

# РАЗМЕРЫ КЭША
cache_mem 256 MB
maximum_object_size 1024 MB
maximum_object_size_in_memory 32 MB

# DNS НАСТРОЙКИ
dns_nameservers 1.1.1.1 1.0.0.1
positive_dns_ttl 6 hours
negative_dns_ttl 30 seconds

# ACL - ОПРЕДЕЛЕНИЕ ДОСТУПА
acl localnet src 10.0.0.0/24    # WireGuard сеть
acl localhost src 127.0.0.1/32
acl SSL_ports port 443
acl Safe_ports port 80          # http
acl Safe_ports port 443         # https
acl Safe_ports port 21          # ftp
acl Safe_ports port 70          # gopher
acl Safe_ports port 210         # wais
acl Safe_ports port 1025-65535  # нестандартные порты
acl Safe_ports port 280         # http-mgmt
acl Safe_ports port 488         # gss-http
acl Safe_ports port 591         # filemaker
acl Safe_ports port 777         # multiling http
acl CONNECT method CONNECT

# ПРАВИЛА ДОСТУПА
http_access allow localnet
http_access allow localhost
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny all

# WARP PROXY НАСТРОЙКИ
# Используем WARP как parent proxy
cache_peer 127.0.0.1 parent 40000 0 \
    no-query \
    originserver \
    name=warp_proxy \
    login=* \
    connect-timeout=5 \
    proxy-only \
    round-robin

# ВСЕГДА используем WARP proxy
never_direct allow all

# ОПТИМИЗАЦИЯ ПРОИЗВОДИТЕЛЬНОСТИ
read_timeout 300 seconds
request_timeout 300 seconds
pconn_timeout 120 seconds
shutdown_lifetime 5 seconds
forward_timeout 120 seconds
connect_timeout 60 seconds

# ЛОГИРОВАНИЕ
access_log daemon:/var/log/squid/access.log squid
cache_log /var/log/squid/cache.log
cache_store_log none

# ОСТАЛЬНЫЕ НАСТРОЙКИ
forwarded_for delete
via off
range_offset_limit -1
coredump_dir /var/spool/squid

# ОБРАБОТКА ОШИБОК
error_directory /usr/share/squid/errors/ru
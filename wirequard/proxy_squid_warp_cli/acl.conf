# ДОПОЛНИТЕЛЬНЫЕ ACL
acl work_hours time MTWHF 09:00-18:00
acl weekend time SA 00:00-23:59

# Блокируем рекламу
acl ads dstdomain "/etc/squid/ads.domains"
acl tracker dstdomain "/etc/squid/trackers.domains"

# Исключения из WARP (если нужно)
acl nowarp dstdomain "/etc/squid/nowarp.domains"

# ПРАВИЛА
http_access deny ads
http_access deny tracker

# Для некоторых доменов отключаем WARP
always_direct allow nowarp